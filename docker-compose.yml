version: "3.8"

services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: falkordb-server
    ports:
      - "6379:6379"
      - "3000:3000"
    restart: always

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: chokepoint-backend
    ports:
      - "8000:8000"
    environment:
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
    depends_on:
      - falkordb
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chokepoint-frontend
    ports:
      - "5174:5174"
    depends_on:
      - backend
    restart: always
